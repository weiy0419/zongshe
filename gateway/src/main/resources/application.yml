server:
  port: 8088

spring:
  application:
    name: gateway

  cloud:
    gateway:
      # 统一在 Gateway 处理跨域
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      routes:
        # ----- 风控 -----
        - id: risk-api
          uri: ${RISK_SERVICE_URI:http://127.0.0.1:8080}
          predicates:
            - Path=/api/risk,/api/risk/**,/api/credit,/api/credit/**,/api/admin/crawler,/api/admin/crawler/**

        # ----- 用户 -----
        - id: credit-users
          uri: ${MAIN_SERVICE_URI:http://127.0.0.1:8080}
          predicates:
            - Path=/api/users,/api/users/**

        # ----- 管理端 -----
        - id: credit-admin
          uri: ${MAIN_SERVICE_URI:http://127.0.0.1:8080}
          predicates:
            - Path=/api/admin,/api/admin/**

        # ----- 认证 -----
        - id: credit-auth
          uri: ${MAIN_SERVICE_URI:http://127.0.0.1:8080}
          predicates:
            - Path=/api/auth,/api/auth/**

        # ----- 产品 -----
        - id: main-products
          uri: ${MAIN_SERVICE_URI:http://127.0.0.1:8080}
          predicates:
            - Path=/api/products,/api/products/**

        # ----- 贷款申请 -----
        - id: main-loan-applications
          uri: ${MAIN_SERVICE_URI:http://127.0.0.1:8080}
          predicates:
            - Path=/api/loan-applications,/api/loan-applications/**

        # ----- 贷款 -----
        - id: main-loans
          uri: ${MAIN_SERVICE_URI:http://127.0.0.1:8080}
          predicates:
            - Path=/api/loans,/api/loans/**

        # ----- 合同 -----
        - id: main-contracts
          uri: ${MAIN_SERVICE_URI:http://127.0.0.1:8080}
          predicates:
            - Path=/api/contracts,/api/contracts/**

        # ----- 还款 -----
        - id: main-repayment
          uri: ${MAIN_SERVICE_URI:http://127.0.0.1:8080}
          predicates:
            - Path=/api/repayment,/api/repayment/**

        # ----- 平台运营 -----
        - id: main-ops
          uri: ${MAIN_SERVICE_URI:http://127.0.0.1:8080}
          predicates:
            - Path=/api/ops,/api/ops/**,/api/audit,/api/audit/**,/api/statistics,/api/statistics/**,/api/settings,/api/settings/**

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: INFO
